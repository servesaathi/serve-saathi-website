<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Serve Saathi — Care for those who cared for us. Coming soon."
    />
    <title>Serve Saathi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->
    <header class="site-header">
      <div class="container nav">
        <a class="brand" href="#home">
          <span class="brand-mark"><i class="bi bi-heart-fill"></i></span>
          Serve <span>Saathi</span>
        </a>

        <ul class="nav-links" id="navLinks">
          <li><a class="active" href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#how">How it works</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>

        <div class="nav-actions">
          <a class="nav-cta" href="#notify">
            <i class="bi bi-bell"></i> Notify Me
          </a>

          <button
            class="nav-toggle"
            id="navToggle"
            aria-label="Toggle navigation"
            aria-expanded="false"
            aria-controls="navLinks"
          >
            <span></span>
          </button>
        </div>
      </div>
    </header>

    <!-- ================= BANNER / HERO ================= -->
    <main>
      <section class="hero" id="home">
        <div class="container hero-grid">
          <div class="hero-copy-col">
            <h1>Care for those who <span>cared</span> for us.</h1>
            <div class="eyebrow-badge">
              <span class="pulse-dot"></span> COMING SOON
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
